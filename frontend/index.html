<!DOCTYPE html>
<html lang="id" data-theme="light" data-font="normal">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#e8590c">
  <meta name="description" content="Aplikasi POS Kasir Toko: Penjualan, Pembelian, Stok, Member, dan Laporan.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="POS Toko">

  <title>POS Kasir Toko</title>

  <!-- Preconnect & DNS Prefetch ke Backend Google Script untuk pangkas latensi TLS/DNS -->
  <link rel="preconnect" href="https://script.google.com" crossorigin>
  <link rel="dns-prefetch" href="https://script.google.com">
  <link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
  <link rel="dns-prefetch" href="https://script.googleusercontent.com">

  <!-- Module Preload Critical Scripts -->
  <link rel="modulepreload" href="./js/app.js">
  <link rel="modulepreload" href="./js/api.js">
  <link rel="modulepreload" href="./js/state.js">
  <link rel="modulepreload" href="./js/routes.js">
  <link rel="modulepreload" href="./js/config.js">

  <!-- PWA Manifest & Icons -->
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/svg+xml" href="./assets/icon.svg">
  <link rel="apple-touch-icon" href="./assets/icon-192.png">

  <!-- Design System CSS (tanpa dependensi luar) -->
  <link rel="stylesheet" href="./css/tokens.css">
  <link rel="stylesheet" href="./css/base.css">
  <link rel="stylesheet" href="./css/components.css">
  <link rel="stylesheet" href="./css/layout.css">

  <style>
    /* Critical Splash Inline CSS agar langsung tampil sekejap tanpa FOUC */
    .splash-screen {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: calc(32px + env(safe-area-inset-top, 0px)) 16px calc(24px + env(safe-area-inset-bottom, 0px));
      background: radial-gradient(circle at 50% 38%, #f8fafc 0%, #edf2f7 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      box-sizing: border-box;
      user-select: none;
      z-index: 9999;
    }

    [data-theme="dark"] .splash-screen {
      background: radial-gradient(circle at 50% 38%, #1e293b 0%, #0f172a 100%);
    }

    .splash-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin-top: auto;
      margin-bottom: auto;
      max-width: 340px;
      width: 100%;
    }

    .splash-logo-wrap {
      position: relative;
      width: 96px;
      height: 96px;
      margin-bottom: 20px;
      display: grid;
      place-items: center;
    }

    .splash-logo {
      width: 84px;
      height: 84px;
      border-radius: 24px;
      background: linear-gradient(135deg, #fb923c 0%, #ea580c 100%);
      display: grid;
      place-items: center;
      box-shadow: 0 14px 32px rgba(234, 88, 12, 0.35);
      z-index: 2;
      animation: splash-pulse 2.6s ease-in-out infinite;
    }

    .splash-logo svg {
      width: 48px;
      height: 48px;
      color: #ffffff;
    }

    .splash-logo-ring {
      position: absolute;
      inset: 0;
      border-radius: 24px;
      border: 2px solid #ea580c;
      opacity: 0.35;
      animation: splash-ring 2.6s cubic-bezier(0.22, 1, 0.36, 1) infinite;
      z-index: 1;
    }

    @keyframes splash-pulse {

      0%,
      100% {
        transform: scale(1);
        box-shadow: 0 14px 32px rgba(234, 88, 12, 0.35);
      }

      50% {
        transform: scale(1.05);
        box-shadow: 0 18px 40px rgba(234, 88, 12, 0.52);
      }
    }

    @keyframes splash-ring {
      0% {
        transform: scale(0.9);
        opacity: 0.85;
      }

      100% {
        transform: scale(1.45);
        opacity: 0;
      }
    }

    .splash-title {
      font-size: 22px;
      font-weight: 800;
      color: #0f172a;
      letter-spacing: -0.02em;
      margin: 0 0 6px;
      line-height: 1.25;
    }

    [data-theme="dark"] .splash-title {
      color: #f8fafc;
    }

    .splash-subtitle {
      font-size: 13.5px;
      color: #64748b;
      margin: 0 0 24px;
      line-height: 1.4;
    }

    [data-theme="dark"] .splash-subtitle {
      color: #94a3b8;
    }

    .splash-progress-track {
      width: 180px;
      height: 4px;
      background: rgba(148, 163, 184, 0.25);
      border-radius: 9999px;
      overflow: hidden;
      position: relative;
      margin-bottom: 14px;
    }

    .splash-progress-bar {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 0;
      width: 45%;
      background: linear-gradient(90deg, #ea580c 0%, #fb923c 100%);
      border-radius: 9999px;
      animation: splash-bar 1.6s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }

    @keyframes splash-bar {
      0% {
        left: -45%;
        width: 30%;
      }

      50% {
        width: 65%;
      }

      100% {
        left: 100%;
        width: 30%;
      }
    }

    .splash-status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: #64748b;
    }

    [data-theme="dark"] .splash-status {
      color: #94a3b8;
    }

    .splash-status-dot {
      width: 7px;
      height: 7px;
      border-radius: 9999px;
      background: #ea580c;
      animation: splash-dot 1.2s infinite ease-in-out;
    }

    @keyframes splash-dot {

      0%,
      100% {
        opacity: 0.3;
        transform: scale(0.85);
      }

      50% {
        opacity: 1;
        transform: scale(1.25);
      }
    }

    .splash-footer {
      font-size: 11.5px;
      color: #94a3b8;
      letter-spacing: 0.02em;
    }
  </style>
</head>

<body>
  <div id="app">
    <!-- Initial Splash Loading Screen ala Native App Modern -->
    <div class="splash-screen">
      <div class="splash-content">
        <!-- Logo Brand Resmi Toko dengan Animasi Glow & Napas -->
        <div class="splash-logo-wrap">
          <div class="splash-logo">
            <svg viewBox="0 0 24 24" width="48" height="48" fill="none" stroke="#ffffff" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <path d="m2 7 4.41-4.41A2 2 0 0 1 7.83 2h8.34a2 2 0 0 1 1.42.59L22 7" />
              <path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8" />
              <path d="M15 22v-4a2 2 0 0 0-2-2h-2a2 2 0 0 0-2 2v4" />
              <path d="M2 7h20" />
              <path
                d="M22 7v3a2 2 0 0 1-2 2v0a2.7 2.7 0 0 1-1.59-.63.7.7 0 0 0-.82 0A2.7 2.7 0 0 1 16 12a2.7 2.7 0 0 1-1.59-.63.7.7 0 0 0-.82 0A2.7 2.7 0 0 1 12 12a2.7 2.7 0 0 1-1.59-.63.7.7 0 0 0-.82 0A2.7 2.7 0 0 1 8 12a2.7 2.7 0 0 1-1.59-.63.7.7 0 0 0-.82 0A2.7 2.7 0 0 1 4 12v0a2 2 0 0 1-2-2V7" />
            </svg>
          </div>
          <div class="splash-logo-ring"></div>
        </div>

        <!-- Judul & Tagline Toko -->
        <div class="splash-text">
          <h1 class="splash-title">POS Kasir Toko</h1>
          <p class="splash-subtitle">Sistem Kasir &amp; Stok Material Bangunan</p>
        </div>

        <!-- Animated Modern Shimmer Progress Bar -->
        <div class="splash-progress-track">
          <div class="splash-progress-bar"></div>
        </div>

        <!-- Indikator Status Memuat -->
        <div class="splash-status">
          <span class="splash-status-dot"></span>
          <span class="splash-status-text">Menyiapkan sistem &amp; database...</span>
        </div>
      </div>

      <!-- Versi di Bagian Bawah -->
      <div class="splash-footer">
        <span>v1.0.23 • Terenkripsi &amp; Siap Offline</span>
      </div>
    </div>
  </div>

  <!-- Vanilla JS ES Modules -->
  <script type="module" src="./js/app.js"></script>
</body>

</html>
